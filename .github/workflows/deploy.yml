name: CI/CD — app.mrcartas.com

# CI roda em PR e em push na main. O deploy só acontece em push na main
# (ou manualmente) e apenas se o build tiver passado.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Garante que dois deploys do mesmo branch não rodem ao mesmo tempo.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: CI — build do Nuxt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22 + cache do npm
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      # Falha cedo se o bundle não foi gerado — evita um deploy que sobe vazio.
      - name: Conferir artefato do build
        run: test -f .output/server/index.mjs

  deploy:
    name: CD — deploy na VPS
    needs: build
    # PRs passam pelo CI mas nunca fazem deploy.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.mrcartas.com
    steps:
      # Só precisamos do repo no runner para ler o script remoto abaixo.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          PORT="${VPS_PORT:-22}"
          ssh-keyscan -p "$PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy (git pull + build + pm2 reload na VPS)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'bash -s' < .github/scripts/vps-deploy.sh

      - name: Healthcheck público
        run: |
          set -euo pipefail
          for _ in $(seq 1 10); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://app.mrcartas.com || echo 000)"
            if [ "$code" = "200" ]; then
              echo "OK: https://app.mrcartas.com respondeu HTTP 200"
              exit 0
            fi
            echo "aguardando... (HTTP $code)"
            sleep 5
          done
          echo "ERRO: https://app.mrcartas.com não respondeu 200"
          exit 1
